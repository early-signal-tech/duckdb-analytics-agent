[project]
name = "duck-harness"
version = "0.1.0"
description = "SQL-to-LLM agent harness using DuckDB and Anthropic Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 1.x SDK: top-level cache_control and the context-management beta.
    "anthropic>=1.5.0",
    # 2.0: Quack (the traces server) and VARIANT trace columns. Needs Python 3.11+.
    "duckdb>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# The app protocol (JSON Lines on stdin/stdout); see duckdb_agent/serve.py.
duck-harness-serve = "duckdb_agent.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the library is installed; agent_harness.py and tests stay in the repo.
packages = ["duckdb_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
